[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us-capital-stack"
version = "0.1.0"
description = "Synthetic US bank stress projections and capital framework comparisons"
readme = "README.md"
requires-python = ">=3.11"
authors = []
dependencies = ["numpy>=1.24", "pandas>=2.0"]
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
capital_stack = ["py.typed"]
